<div class="auth-container">
  <div class="auth-card animate-fade-in">
    <div class="auth-header">
      <div class="logo">💠</div>
      <h1>Welcome Back<span>.</span></h1>
      <p>Log in to TaskMinder to continue your journey.</p>
    </div>

    <form [formGroup]="loginForm" (submit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrapper">
          <span class="icon">📧</span>
          <input 
            type="email" 
            formControlName="email" 
            placeholder="name@company.com"
            [class.invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          />
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
          <span class="icon">🔒</span>
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            formControlName="password" 
            placeholder="••••••••"
            [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          />
          <span class="toggle-pwd" (click)="showPassword = !showPassword">
            {{ showPassword ? '👁️' : '🔒' }}
          </span>
        </div>
      </div>

      <div class="pwd-options">
        <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn-auth-submit" [disabled]="loginForm.invalid">
        Sign in to Account
      </button>

      <div class="auth-footer">
        Don't have an account? <a routerLink="/register">Create one for free</a>
      </div>
    </form>
  </div>
</div>
